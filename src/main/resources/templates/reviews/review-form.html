<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Formulario de reseña')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <h1 class="mb-4">
        <i class="fa-regular fa-comments text-primary me-2"></i>
        <span th:text="${review.id != null ? 'Editar reseña' : 'Nueva reseña'}">Formulario de reseña</span>
    </h1>

    <!-- Aviso de peli asociada -->
    <div class="alert alert-info my-3" th:if="${review.movie != null}">
        <i class="fa-solid fa-film me-1"></i>
        Reseña sobre: <strong th:text="${review.movie.title}"></strong>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/reviews}" method="post" th:object="${review}">

                <!--ID para edicion -->
                <input type="hidden" th:field="*{id}">

                <!-- movieid como campo separado para que el POST lo reciba limpio -->
                <input type="hidden" name="movieId"
                       th:value="${review.movie != null ? review.movie.id : ''}">

                <div class="mb-3">
                    <label for="title" class="form-label">Título <span class="text-danger">*</span></label>
                    <input id="title" type="text" class="form-control"
                           th:field="*{title}" required maxlength="255"
                           placeholder="Escribe un título para tu reseña">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descripción <span class="text-danger">*</span></label>
                    <textarea id="description" class="form-control" rows="5"
                              th:field="*{description}" required maxlength="1000"
                              placeholder="Cuéntanos qué te ha parecido la película..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="rating" class="form-label">Puntuación (1 – 5) <span class="text-danger">*</span></label>
                    <input type="number" id="rating" class="form-control"
                           th:field="*{rating}" min="1" max="5" required style="max-width: 120px;">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
                    </button>
                    <a th:if="${review.movie != null}"
                       class="btn btn-secondary"
                       th:href="@{/movies/{id}(id=${review.movie.id})}">
                        Cancelar
                    </a>
                    <a th:if="${review.movie == null}"
                       class="btn btn-secondary"
                       th:href="@{/reviews}">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
