<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('detalle de la proyeccion')}">
    <meta charset="UTF-8">
    <title>proyeccion</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<h1 class="mt-4" th:text="${proyecciones.movie != null ? proyecciones.movie.title : 'Proyección #' + proyecciones.id}"></h1>

<main class="container my-5">
    <a th:href="@{/sessions}" class="text-decoration-none mb-3 d-inline-block">&larr; Volver a proyecciones</a>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-4" th:if="${proyecciones.movie != null}">
                <img th:src="${proyecciones.movie.imageUrl}" class="img-fluid" alt="Poster" style="object-fit:cover; width:100%; height:100%;">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h1 class="h3 mb-2" th:text="${proyecciones.movie != null ? proyecciones.movie.title : 'Proyección #' + proyecciones.id}">Título</h1>
                    <p class="text-muted mb-1" th:if="${proyecciones.movie != null}" th:text="${proyecciones.movie.genre}">Género</p>

                    <div class="row g-3 my-3">
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Fecha</p>
                            <p class="fs-6" th:text="${#temporals.format(proyecciones.startTime, 'dd/MM/yyyy')}">01/01/2026</p>
                        </div>
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Hora</p>
                            <p class="fs-6" th:text="${#temporals.format(proyecciones.startTime, 'HH:mm')}">20:00</p>
                        </div>
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Precio</p>
                            <p class="fs-6" th:text="${#numbers.formatCurrency(proyecciones.price)}">10.00€</p>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Sala</p>
                            <p class="fs-6" th:text="${proyecciones.room != null ? proyecciones.room.name : 'Sin sala asignada'}">Sala 1</p>
                        </div>
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Capacidad</p>
                            <p class="fs-6" th:text="${proyecciones.room != null ? proyecciones.room.capacity : '-'}">120</p>
                        </div>
                        <div class="col-sm-4">
                            <p class="text-muted small mb-0">Tipo</p>
                            <p class="fs-6" th:text="${proyecciones.room != null ? proyecciones.room.screenType : '-'}">STANDARD</p>
                        </div>
                    </div>

                    <div class="mt-3">
                        <p class="text-muted small mb-0">Idioma</p>
                        <p th:text="${proyecciones.language != null ? proyecciones.language : '—'}">VO</p>

                        <p class="text-muted small mb-0">Duración anuncios (min)</p>
                        <p th:text="${proyecciones.adMinutes != null ? proyecciones.adMinutes : '0'}">10</p>
                    </div>

                    <div class="mt-3">

                        <!--                           TODO  Tengo que poner las sessiones AQUI-->
                        <ul class="list-unstyled">
                            <li th:each="ticket : ${tickets}">
                                <span th:text="${'Fila: ' + ticket.row}"></span>
                                <span th:text="${'Butaca: ' + ticket.seat}"></span>
<!--                                TODO if status != PAGADO entonces puedes comprar, si PAGADO entonces no hay boton comra-->
                                <a th:if="${ticket.status != 'PAGADO'}" th:href="@{/tickets/buy/{id}(id=${ticket.id})}" class="btn btn-sm btn-primary">Comprar ticket</a>
                                <span th:if="${ticket.status == 'PAGADO'}" class="badge bg-success">Pagado</span>
                            </li>
                        </ul>

                    </div>

                    <div class="mt-4">
                        <a th:href="@{/sessions/edit/{id}(id=${proyecciones.id})}" class="btn btn-outline-primary me-2">Editar</a>
                        <a th:href="@{/sessions}" class="btn btn-secondary">Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

 <!-- TODO session detail   room   movie   tickets  -->
</body>
</html>
