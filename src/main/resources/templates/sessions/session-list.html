<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('proyecciones')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<div class="container">
    <h1 class="mt-4">proyecciones</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
        <li class="breadcrumb-item active">proyecciones</li>
    </ol>
    <div class="card mb-4">
        <div class="card-header">
            <div class="row">
                <div class="col">
                    <i class="fa-solid fa-film me-1"></i>
                    Listado de proyecciones
                    <div class="float-right">
                        <a th:href="@{/sessions/new}" class="btn btn-outline-primary">
                            <i class="fa-solid fa-plus me-1"></i> Nueva proyección
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle table-bordered border-success">
                    <thead class="table-dark">
                    <tr>
                        <th>Id</th>
                        <th>
                            <i class="fa-solid fa-calendar"></i>
                            Fecha y hora
                        </th>
                        <th>
                            <i class="fa-solid fa-euro"></i>
                            Precio
                        </th>
                        <th>Película</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <!-- Fila para el caso "sin proyecciones" -->
                    <tr th:if="${#lists.isEmpty(proyecciones)}">
                        <td colspan="5" class="text-center text-muted">No hay proyecciones disponibles.</td>
                    </tr>

                    <!-- Filas normales -->
                    <tr th:each="proyeccion : ${proyecciones}">
                        <td th:text="${proyeccion.id}"></td>
                        <td class="fw-semibold" th:text="${proyeccion.startTime != null ? #temporals.format(proyeccion.startTime, 'dd/MM/yy HH:mm') : '—'}"></td>
                        <td class="text-muted small" th:text="${proyeccion.price != null ? #numbers.formatDecimal(proyeccion.price, 1, 2) : '-'}"></td>
                        <td th:text="${proyeccion.movie != null ? proyeccion.movie.title : '—'}"></td>
                        <td>
                            <a th:href="@{/sessions/{id}(id=${proyeccion.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fa-regular fa-eye me-1"></i> Ver
                            </a>
                            <a th:href="@{/sessions/edit/{id}(id=${proyeccion.id})}"
                               class="btn btn-sm btn-outline-success">
                                <i class="fa-solid fa-pencil me-1"></i> Editar
                            </a>
                            <a th:href="@{/sessions/delete/{id}(id=${proyeccion.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Estás seguro de que deseas eliminar esta proyección?');">
                                <i class="fa-solid fa-trash me-1"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
