<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Mis Tickets')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0 text-dark"><i class="fa-solid fa-ticket-simple me-2 text-primary"></i>Mis Tickets</h1>
            <p class="text-muted small mb-0">Gestiona tus entradas y reservas</p>
        </div>
        <span class="badge bg-primary rounded-pill px-3 py-2" th:text="|${tickets.size()} tickets|">0 resultados</span>
    </div>

    <div th:if="${tickets.isEmpty()}" class="alert alert-info shadow-sm text-center py-5">
        <i class="fa-solid fa-circle-info fa-3x mb-3"></i>
        <p class="fs-5">Aún no tienes tickets comprados.</p>
        <a th:href="@{/movies}" class="btn btn-primary">Ir a la cartelera</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="ticket : ${tickets}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">
                <div class="position-relative">
                    <img th:src="${ticket.session.movie.imageUrl}"
                         class="card-img-top"
                         alt="Póster"
                         style="height: 220px; object-fit: cover;">
                    <span class="position-absolute top-0 end-0 m-3 badge bg-dark opacity-75 fs-6">
                        [[${#numbers.formatCurrency(ticket.price)}]]
                    </span>
                </div>

                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${ticket.session.movie.title}">Título Película</h5>

                    <div class="d-flex gap-2 mb-3">
                        <span class="badge bg-light text-dark border">
                            <i class="fa-solid fa-chair me-1 text-primary"></i> Fila: [[${ticket.row}]]
                        </span>
                        <span class="badge bg-light text-dark border">
                            <i class="fa-solid fa-user-tag me-1 text-primary"></i> Asiento: [[${ticket.seat}]]
                        </span>
                    </div>

                    <div class="small text-muted mb-3">
                        <div class="mb-1">
                            <i class="fa-regular fa-calendar-days me-1"></i>
                            <span th:text="${#temporals.format(ticket.session.dateTime, 'dd/MM/yyyy')}">01/01/2024</span>
                        </div>
                        <div>
                            <i class="fa-regular fa-clock me-1"></i>
                            <span th:text="${#temporals.format(ticket.session.dateTime, 'HH:mm')}">20:00</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span th:classappend="${ticket.status.name() == 'LIBRE' ? 'badge bg-success' :
                                          (ticket.status.name() == 'PAGADO' ? 'badge bg-info' : 'badge bg-warning')}"
                              th:text="${ticket.status}">Estado</span>

                        <small class="text-muted" th:text="${ticket.session.room.name}">Sala 1</small>
                    </div>
                </div>

                <div class="card-footer bg-white border-top-0 pb-3">
                    <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                       class="btn btn-outline-primary w-100">
                        <i class="fa-solid fa-qrcode me-1"></i> Detalles del Ticket
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>
<div th:replace="~{footer :: scripts}"></div>

</body>
</html>
