<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/head :: head('Formulario de Ticket')}"></head>

<body class="bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fa-solid fa-ticket me-2"></i> Registro de Ticket</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/tickets/save}" th:object="${ticket}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fila</label>
                                <input type="text" th:field="*{row}" class="form-control" placeholder="Ej: A" maxlength="2" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Asiento</label>
                                <input type="text" th:field="*{seat}" class="form-control" placeholder="Ej: 12" maxlength="3" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Precio (€)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-euro-sign"></i></span>
                                    <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Descuento</label>
                                <input type="number" step="0.01" th:field="*{discount}" class="form-control" placeholder="0.00">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Estado</label>
                                <select th:field="*{status}" class="form-select">
                                    <option th:each="status : ${T(com.demo.model.enums.BuyStatus).values()}"
                                            th:value="${status}" th:text="${status}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Sesión / Función</label>
                                <select th:field="*{session}" class="form-select" required>
                                    <option value="">Seleccione una sesión...</option>
                                    <option th:each="s : ${sessions}"
                                            th:value="${s.id}"
                                            th:text="${s.movie.title + ' - ' + s.room.name}"></option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">Usuario</label>
                                <select th:field="*{user}" class="form-select">
                                    <option value="">Seleccione un usuario...</option>
                                    <option th:each="u : ${users}"
                                            th:value="${u.id}"
                                            th:text="${u.email}"></option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">Código QR</label>
                                <input type="text" th:field="*{QRCode}" class="form-control" placeholder="URL o Hash del código QR">
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end">
                            <a th:href="@{/tickets}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fa-solid fa-save me-1"></i> Guardar Ticket
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
