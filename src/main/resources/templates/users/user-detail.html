<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Detalle Usuario — Only Film')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <h1 class="mb-3">
        <i class="fa-solid fa-user text-gold me-2" aria-hidden="true"></i>
        <span th:text="${'Usuario: ' + user.id}"></span>
    </h1>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden mb-4">

        <div class="card-body d-flex align-items-center gap-4 flex-wrap">

            <dl class="row mb-0 flex-grow-1">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${user.id}"></dd>
                <dt class="col-sm-3">Username</dt>
                <dd class="col-sm-9" th:text="${user.username}"></dd>
                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${user.email}"></dd>
                <dt class="col-sm-3">Rol</dt>
                <dd class="col-sm-9" th:text="${user.role}"></dd>
            </dl>

            <img th:if="${user.imageUrl != null}" th:src="${user.imageUrl}"
                 class="rounded-circle"
                 style="width:150px; height:150px; object-fit:cover; flex-shrink:0;"
                 alt="Foto perfil">

        </div>
        <div class="card-footer bg-transparent border-top d-flex gap-2 justify-content-end">
            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i> Volver
            </a>
            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-user-pen me-1" aria-hidden="true"></i> Editar
            </a>
            <a th:if="${user.active and user.role.name() != 'ROLE_ADMIN'}"
               th:href="@{/admin/users/deactivate/{id}(id=${user.id})}" class="btn btn-sm btn-danger">
                <i class="fa-solid fa-user-slash me-1" aria-hidden="true"></i> Desactivar
            </a>
            <a th:if="${!user.active}"
               th:href="@{/admin/users/activate/{id}(id=${user.id})}" class="btn btn-sm btn-success">
                <i class="fa-solid fa-user-check me-1" aria-hidden="true"></i> Activar
            </a>
        </div>

    </div>

    <!-- ENTRADAS COMPRADAS -->
    <div class="mb-5">
        <h3 class="mb-4">
            <i class="fa-solid fa-ticket text-gold me-2"></i>
            Entradas compradas
            <span class="badge badge-secondary ms-2 align-middle" th:text="${#lists.size(userStats.tickets())}">0</span>
        </h3>

        <div th:if="${#lists.isEmpty(userStats.tickets())}" class="alert alert-info border">
            <i class="fa-solid fa-info-circle me-2"></i>
            Este usuario no ha comprado ninguna entrada todavía.
        </div>

        <div th:if="${!#lists.isEmpty(userStats.tickets())}" class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark mb-0">
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-hashtag me-1"></i>ID</th>
                                <th><i class="fa-solid fa-film me-1"></i>Película</th>
                                <th><i class="fa-solid fa-calendar me-1"></i>Fecha sesión</th>
                                <th><i class="fa-solid fa-door-open me-1"></i>Sala</th>
                                <th><i class="fa-solid fa-couch me-1"></i>Butaca</th>
                                <th><i class="fa-solid fa-euro-sign me-1"></i>Total</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${userStats.tickets()}">
                                <td class="align-middle">
                                    <span class="badge bg-primary" th:text="${ticket.id}"></span>
                                </td>
                                <td class="align-middle text-secondary" th:text="${ticket.session.movie.title}"></td>
                                <td class="align-middle text-secondary"
                                    th:text="${#temporals.format(ticket.session.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="align-middle text-secondary" th:text="${ticket.session.room.name}"></td>
                                <td class="align-middle">
                                    <span class="badge badge-secondary">
                                        Fila <span th:text="${ticket.row}"></span>
                                        &nbsp;Butaca <span th:text="${ticket.seat}"></span>
                                    </span>
                                </td>
                                <td class="align-middle">
                                    <span class="text-gold fw-bold"
                                          th:text="${#numbers.formatDecimal(ticket.price + (ticket.snackPrice != null ? ticket.snackPrice : 0), 1, 2) + ' €'}"></span>
                                </td>
                                <td class="align-middle text-end">
                                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-sm btn-outline-light">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
