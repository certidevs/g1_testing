<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Formulario Sala')}">
</head>

<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Salas</h1>
        <a th:href="@{/salas}" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Volver al listado
        </a>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0 text-muted">
            / Salas / Formulario Sala
        </h5>
    </div>
    <form th:action="@{/salas}" method="post" th:object="${room}">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{active}" disabled>

        <div class="mb-3">
            <label for="name" class="form-label">Nombre de la sala</label>
            <input type="text" class="form-control" id="name" name="name" th:field="*{name}" placeholder="Ej: Sala 1" required maxlength="50">
        </div>
        <div class="mb-3">
            <label for="capacity" class="form-label">Capacidad</label>
            <input type="number" class="form-control" id="capacity" name="capacity" th:field="*{capacity}" required placeholder="Ej: 100">
        </div>
        <div class="mb-3">
            <label for="screenType" class="form-label">Tipo de pantalla</label>
            <select class="form-select" id="screenType" name="screenType" th:field="*{screenType}">
                <option value="" disabled selected>Selecciona un tipo de pantalla</option>
                <option th:value="${T(com.demo.model.enums.ScreenType).STANDARD}" th:text="'Estándar'"></option>
                <option th:value="${T(com.demo.model.enums.ScreenType).D3}" th:text="'3D'"></option>
                <option th:value="${T(com.demo.model.enums.ScreenType).IMAX}" th:text="'IMAX'"></option>
                <option th:value="${T(com.demo.model.enums.ScreenType).D4X}" th:text="'4DX'"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-check"></i> Guardar
        </button>
    </form>
</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
