<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/index.html}">
            <img th:src="@{/images/img_2.png}" alt="Cines"
                 height="32" class="me-2 rounded-3">
            <!--            <span>Restaurantes</span>-->
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/movies}">
                        <i class="fa-solid fa-film"></i> Cartelera
                    </a>
                </li>

                <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a class="nav-link" th:href="@{/salas}">
                        <i class="fa-solid fa-tv"></i> Salas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sessions}">
                        <i class="fa-solid fa-video"></i> Funciones
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tickets}">
                        <i class="fa-solid fa-ticket"></i> Tickets
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reviews}">
                        <i class="fa-regular fa-comments"></i> Opiniones
                    </a>
                </li>
            </ul>
<!--            <a class="btn btn-outline-light btn-sm" th:href="@{/movies/create}">-->
<!--                <i class="fa-solid fa-plus"></i> Nueva pelicula-->
<!--            </a>-->


            <!-- TODO is authenticated mostrar nombre username -->


            <a sec:authorize="!isAuthenticated()" class="btn btn-outline-light btn-sm" th:href="@{/login}">
                <i class="fa-solid fa-user"></i>
            </a>

            <a sec:authorize="!isAuthenticated()" class="btn btn-light btn-sm ms-2" th:href="@{/register}">
                <i class="fa-solid fa-user-plus"></i> Registrate aquí
            </a>

            <span class="text-light me-2" sec:authorize="isAuthenticated()">
                <i class="fa-solid fa-user"></i>
                <span sec:authentication="name"></span>
            </span>

            <form th:action="@{/logout}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                <button class="btn btn-danger">
                    <i class="fa-solid fa-sign-out"></i>
                </button>
            </form>

        </div>
    </div>
</nav>
</body>
</html>
